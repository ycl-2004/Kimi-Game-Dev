<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Fever mode and special deliveries</title>
  <desc id="desc">Four deliveries in a row fill Fever. Tap Fever or press Space for double score and wider Perfect zones. Later levels add Fragile, Express, and 2-key Chord islands.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="0" flood-color="#2B211E" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="720" height="420" rx="30" fill="#DDF1FF"/>
  <path d="M0 330c120-32 220 20 340-6 125-26 235 16 380-14v110H0Z" fill="#FFF6E9"/>

  <!-- Left: Manual Fever Meter Card -->
  <g transform="translate(46 40)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="304" rx="22" fill="#FFF6E9" stroke="#2B211E" stroke-width="5"/>
    <text x="140" y="34" text-anchor="middle" fill="#2B211E" font-family="sans-serif" font-size="16" font-weight="800" letter-spacing="1.5">FEVER MODE</text>
    <!-- Fever Tube -->
    <rect x="44" y="54" width="46" height="188" rx="23" fill="#FFF6E9" stroke="#2B211E" stroke-width="4.5"/>
    <rect x="48" y="64" width="38" height="168" rx="18" fill="#FFD166"/>
    <rect x="38" y="62" width="58" height="11" rx="5" fill="#FFD166" stroke="#2B211E" stroke-width="3"/>
    <rect x="38" y="220" width="58" height="11" rx="5" fill="#FFD166" stroke="#2B211E" stroke-width="3"/>
    <rect x="36" y="254" width="62" height="28" rx="9" fill="#FFD166" stroke="#2B211E" stroke-width="3.5"/>
    <text x="67" y="273" text-anchor="middle" fill="#2B211E" font-family="monospace" font-size="13" font-weight="800">TAP!</text>

    <!-- Fever Benefits -->
    <g transform="translate(114 60)">
      <rect x="0" y="0" width="144" height="48" rx="12" fill="#FFD166" stroke="#2B211E" stroke-width="3.5"/>
      <text x="72" y="21" text-anchor="middle" fill="#2B211E" font-family="sans-serif" font-size="13" font-weight="800">4 STREAK FILLS</text>
      <text x="72" y="38" text-anchor="middle" fill="#2B211E" font-family="monospace" font-size="11" font-weight="700">TAP OR SPACE!</text>

      <rect x="0" y="64" width="144" height="60" rx="12" fill="#FF6B4A" stroke="#2B211E" stroke-width="3.5"/>
      <text x="72" y="88" text-anchor="middle" fill="#FFF6E9" font-family="sans-serif" font-size="18" font-weight="800">2× SCORE</text>
      <text x="72" y="109" text-anchor="middle" fill="#FFF6E9" font-family="monospace" font-size="11" font-weight="700">FOR 8 SECONDS</text>

      <rect x="0" y="138" width="144" height="52" rx="12" fill="#FF9F1C" stroke="#2B211E" stroke-width="3.5"/>
      <text x="72" y="161" text-anchor="middle" fill="#2B211E" font-family="sans-serif" font-size="13" font-weight="800">WIDER PERFECT</text>
      <text x="72" y="178" text-anchor="middle" fill="#2B211E" font-family="monospace" font-size="10.5" font-weight="700">EASIER BULLSEYES</text>
    </g>
  </g>

  <!-- Right: Upcoming Route Upgrades -->
  <g transform="translate(352 40)" filter="url(#shadow)">
    <!-- Fragile -->
    <rect x="0" y="0" width="322" height="90" rx="18" fill="#5299EB" stroke="#2B211E" stroke-width="5"/>
    <rect x="18" y="18" width="54" height="54" rx="12" fill="#FFF6E9" stroke="#2B211E" stroke-width="4"/>
    <path d="M35 32h18v11a9 9 0 0 1-18 0V32Zm4 24h10" fill="none" stroke="#2B211E" stroke-width="3.5" stroke-linecap="round"/>
    <text x="88" y="38" fill="#FFF6E9" font-family="sans-serif" font-size="20" font-weight="800">FRAGILE (LVL 2+)</text>
    <text x="88" y="61" fill="#FFF6E9" font-family="monospace" font-size="12" font-weight="700">NARROW ZONE · DON'T SHATTER</text>

    <!-- Express -->
    <rect x="0" y="106" width="322" height="90" rx="18" fill="#FF6B4A" stroke="#2B211E" stroke-width="5"/>
    <rect x="18" y="124" width="54" height="54" rx="12" fill="#FFF6E9" stroke="#2B211E" stroke-width="4"/>
    <path d="m30 144 15-8 15 8v16l-15 8-15-8v-16Zm0 0 15 8 15-8" fill="none" stroke="#2B211E" stroke-width="3" stroke-linejoin="round"/>
    <text x="88" y="144" fill="#FFF6E9" font-family="sans-serif" font-size="20" font-weight="800">EXPRESS (LVL 2+)</text>
    <text x="88" y="167" fill="#FFF6E9" font-family="monospace" font-size="12" font-weight="700">5.5s TIMER · FASTER NEEDLE</text>

    <!-- Chords -->
    <rect x="0" y="212" width="322" height="92" rx="18" fill="#9378D8" stroke="#2B211E" stroke-width="5"/>
    <rect x="18" y="232" width="34" height="34" rx="9" fill="#FFF6E9" stroke="#2B211E" stroke-width="3.5"/>
    <text x="35" y="255" text-anchor="middle" fill="#2B211E" font-family="monospace" font-size="18" font-weight="800">1</text>
    <text x="61" y="256" text-anchor="middle" fill="#FFF6E9" font-family="sans-serif" font-size="18" font-weight="800">+</text>
    <rect x="70" y="232" width="34" height="34" rx="9" fill="#FFF6E9" stroke="#2B211E" stroke-width="3.5"/>
    <text x="87" y="255" text-anchor="middle" fill="#2B211E" font-family="monospace" font-size="18" font-weight="800">2</text>
    <text x="118" y="248" fill="#FFF6E9" font-family="sans-serif" font-size="20" font-weight="800">CHORDS (LVL 3)</text>
    <text x="118" y="271" fill="#FFF6E9" font-family="monospace" font-size="10.5" font-weight="700">HOLD 2 KEYS OR BRIDGE</text>
  </g>

  <text x="48" y="392" fill="#2B211E" font-family="sans-serif" font-size="16" font-weight="800" letter-spacing="2">4 IN A ROW = FEVER READY</text>
  <text x="674" y="392" text-anchor="end" fill="#2B211E" font-family="monospace" font-size="15" font-weight="700">TAP TO ACTIVATE</text>
</svg>
