<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Read the power bar zones</title>
  <desc id="desc">The needle sweeps up and down between 0 and 100. Orange is Good, and Cat-Red is Perfect.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="0" flood-color="#2B211E" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="720" height="420" rx="30" fill="#FFF6E9"/>
  <circle cx="628" cy="74" r="42" fill="#FFD166" opacity="0.75"/>
  <g fill="#DDF1FF" stroke="#2B211E" stroke-width="4">
    <path d="M36 96c4-22 36-28 48-9 18-18 51-2 45 21H36c-6-2-6-9 0-12Z"/>
    <path d="M510 318c5-22 38-28 51-10 19-18 54-2 47 22H510c-7-3-7-9 0-12Z"/>
  </g>

  <!-- Main Power Bar Diagram -->
  <g transform="translate(82 34)" filter="url(#shadow)">
    <rect x="0" y="0" width="186" height="320" rx="36" fill="#DDF1FF" stroke="#2B211E" stroke-width="5.5"/>
    <text x="32" y="42" fill="#2B211E" font-family="monospace" font-size="14" font-weight="800">100</text>
    <text x="42" y="294" fill="#2B211E" font-family="monospace" font-size="14" font-weight="800">0</text>
    <rect x="74" y="24" width="76" height="272" rx="22" fill="#F2DEC6" stroke="#2B211E" stroke-width="4.5"/>
    <rect x="78" y="110" width="68" height="114" fill="#FF9F1C"/>
    <text x="112" y="129" text-anchor="middle" fill="#2B211E" font-family="sans-serif" font-size="10" font-weight="800">GOOD</text>
    <rect x="78" y="140" width="68" height="54" fill="#FF6B4A" stroke="#FFF6E9" stroke-width="2.5"/>
    <text x="112" y="160" text-anchor="middle" fill="#FFF6E9" font-family="sans-serif" font-size="11.5" font-weight="800">PERFECT</text>
    <text x="112" y="213" text-anchor="middle" fill="#2B211E" font-family="sans-serif" font-size="10" font-weight="800">GOOD</text>
    <path d="M62 179h102" stroke="#2B211E" stroke-width="7" stroke-linecap="round"/>
    <circle cx="164" cy="179" r="14" fill="#FF6B4A" stroke="#2B211E" stroke-width="4.5"/>
    <!-- Up and Down Sweep Arrows -->
    <path d="M112 94V54m-13 13 13-13 13 13M112 240v40m-13-13 13 13 13-13" fill="none" stroke="#2B211E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Connectors aligned cleanly to PERFECT band (y=186) and bottom GOOD band (y=243) -->
  <path d="M228 186 H288 Q296 186 296 178 V103 Q296 95 304 95 H344" fill="none" stroke="#FF6B4A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/>
  <path d="M228 243 H288 Q296 243 296 235 V207 Q296 199 304 199 H344" fill="none" stroke="#FF9F1C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/>
  <circle cx="228" cy="186" r="4.5" fill="#FF6B4A" stroke="#FFF6E9" stroke-width="1.5"/>
  <circle cx="228" cy="243" r="4.5" fill="#FF9F1C" stroke="#FFF6E9" stroke-width="1.5"/>

  <!-- Legend Cards on Right -->
  <g transform="translate(344 52)" filter="url(#shadow)">
    <rect x="0" y="0" width="322" height="86" rx="18" fill="#FF6B4A" stroke="#2B211E" stroke-width="5"/>
    <circle cx="48" cy="43" r="24" fill="#FFF6E9" stroke="#2B211E" stroke-width="4"/>
    <circle cx="48" cy="43" r="12" fill="#FF6B4A" stroke="#2B211E" stroke-width="3"/>
    <text x="88" y="38" fill="#2B211E" font-family="sans-serif" font-size="22" font-weight="800">CAT-RED = PERFECT</text>
    <text x="88" y="61" fill="#2B211E" font-family="monospace" font-size="13" font-weight="700">+150 BASE · BULLSEYE!</text>
  </g>

  <g transform="translate(344 156)" filter="url(#shadow)">
    <rect x="0" y="0" width="322" height="82" rx="18" fill="#FF9F1C" stroke="#2B211E" stroke-width="5"/>
    <circle cx="48" cy="41" r="22" fill="#FFF6E9" stroke="#2B211E" stroke-width="4"/>
    <path d="m38 41 7 7 14-14" fill="none" stroke="#2B211E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="36" fill="#2B211E" font-family="sans-serif" font-size="22" font-weight="800">ORANGE = GOOD</text>
    <text x="88" y="59" fill="#2B211E" font-family="monospace" font-size="13" font-weight="700">+100 BASE · KEEPS STREAK</text>
  </g>

  <!-- Island Drift Explanation Strip -->
  <g transform="translate(344 256)" filter="url(#shadow)">
    <rect x="0" y="0" width="322" height="72" rx="16" fill="#DDF1FF" stroke="#2B211E" stroke-width="4.5"/>
    <text x="161" y="29" text-anchor="middle" fill="#2B211E" font-family="sans-serif" font-size="15" font-weight="800">ISLANDS DRIFT NEAR ↔ FAR</text>
    <text x="161" y="52" text-anchor="middle" fill="#2B211E" font-family="monospace" font-size="12" font-weight="700">ZONES SHIFT TO MATCH DISTANCE</text>
  </g>

  <text x="48" y="392" fill="#2B211E" font-family="sans-serif" font-size="16" font-weight="800" letter-spacing="2">NEEDLE SWEEPS 0 ↔ 100</text>
  <text x="674" y="392" text-anchor="end" fill="#2B211E" font-family="monospace" font-size="15" font-weight="700">CAT-RED = BULLSEYE</text>
</svg>
